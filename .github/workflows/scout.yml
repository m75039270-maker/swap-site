name: MONEYBOT SCOUT — paid task discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: moneybot-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public GitHub bounty issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/scout.py
      - name: Save SCOUT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneybot-scout-${{ github.run_id }}
          path: moneybot-scout-output/
          if-no-files-found: error
          retention-days: 7
